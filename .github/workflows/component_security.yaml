name: .. 🚧 🐈‍⬛ Audit

on:
  workflow_call:
    secrets:
      slack_webhook:
        required: false
permissions:
  contents: read

jobs:
  audit:
    name: Rust audit scanner
    runs-on: ubuntu-latest
    if: ${{ ! github.event.schedule }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  audit_scheduled:
    name: Scheduled rust audit scanner
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Send notification to Slack Workflow
        if: ${{ failure() }}
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "text": ":rotating_light: Hi AC (@hero), critical or high vulnerabilities found in the OpAMP client, see scheduled security action. :rotating_light:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook }}
