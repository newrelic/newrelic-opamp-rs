name: release
on:
  release:
    types:
      - prereleased
      - released
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  third-party-notices-check:
    name: Check third party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: newrelic/rust-licenses-noticer@aafd951d814aa31bbe4a5b463fd52ba208905562 # v1.0.4
        with:
          template-file: THIRD_PARTY_NOTICES.md.tmpl

  build:
    needs: [ third-party-notices-check ]
    runs-on: ubuntu-latest
    name: Checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify version matches tag
        run: |
          VERSION_IN_CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' opamp-client/Cargo.toml)
          if [ "${VERSION_IN_CARGO}" != "${{ github.ref_name }}" ]; then
            echo "Package version specified in Cargo.toml (${VERSION_IN_CARGO}) differs from tag (${{ github.ref_name }}), exiting"
            exit 1
          fi

      - name: Send notification to Slack Workflow
        if: ${{ failure() }}
        id: slack
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          payload: |
            {
              "text": ":x: Hi AC, an OpAMP client release has just failed"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook }}
