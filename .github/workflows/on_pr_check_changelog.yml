name: validates changelog

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  check-changelog:
    uses: newrelic/newrelic-agent-control/.github/workflows/shared_check_changelog.yml@3061917a8ac7712b8e04a1664d032e7bf66fda3b # TODO: replace with the merge commit of newrelic-agent-control#3066
